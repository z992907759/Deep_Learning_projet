seed: 42
device: auto

data:
  root: "data"
  manifest_csv: "data/manifest.csv"
  image_size: 224
  num_workers: 0

train:
  epochs: 10
  batch_size: 4
  lr: 3.0e-4
  weight_decay: 0.05

model:
  backbone: "vit_base_patch16_224"
  backbone_small: "vit_small_patch16_224"
  backbone_large: "vit_base_patch16_224"
  num_classes: 2
  pooling: "cls"
  cross_attn_heads: 8
  fusion_dim: 384
  pretrained: true

experiment:
  mode: "A"
  use_dummy: false

o3:
  patch_size: 16
  eps: 0.001
  gamma: 1.0
  normalize: true

o5:
  tag: O5
  epochs: 10
  batch_size: 8
  lr: 1e-4
  weight_decay: 1e-4
  lambda_iou: 0.5
  branch: seg
